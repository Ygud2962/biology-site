<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1611" />
<title>Виртуальный микроскоп — Ресурсный центр «Биология»</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1611;
  --panel:rgba(15,31,24,.9);
  --accent:#7ce8a4;
  --gold:#d4af5a;
  --text:#f0e9d8;
  --muted:#8ea79a;
  --line:rgba(124,232,164,.18);
  --grad:linear-gradient(135deg,#7ce8a4 0%,#d4af5a 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(124,232,164,.05), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(212,175,90,.05), transparent 45%);
  z-index:0;
  pointer-events:none;
}

/* ============ ХЕДЕР ============ */
.top-bar{
  position:relative;
  z-index:100;
  padding:14px clamp(16px, 4vw, 40px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:rgba(11,22,17,.7);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:50px;
  border:1px solid var(--line);
  font-size:13px;
  color:var(--muted);
  background:rgba(15,31,24,.6);
  white-space:nowrap;
  flex-shrink:0;
}
.brand{
  font-family:'Playfair Display',serif;
  font-size:12px;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand::before{
  content:'';
  width:7px;height:7px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  flex-shrink:0;
}

/* ============ ОСНОВНОЙ КОНТЕЙНЕР ============ */
.stage{
  position:relative;
  z-index:1;
  width:100%;
  max-width:1440px;
  margin:0 auto;
  padding:clamp(12px, 2vw, 24px) clamp(16px, 4vw, 40px) clamp(40px, 6vw, 80px);
  display:grid;
  grid-template-columns: minmax(180px, 240px) minmax(0, 1fr) minmax(260px, 340px);
  gap:clamp(14px, 2vw, 22px);
  align-items:start;
}

/* ============ ПРЕПАРАТЫ ============ */
.slides-panel{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.slides-title{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:13px;
  color:var(--gold);
  letter-spacing:1px;
  margin-bottom:2px;
}
.slide{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(15,31,24,.6);
  border:1px solid var(--line);
  transition:all .25s;
  text-align:left;
  font-size:13px;
  width:100%;
}
.slide.active{
  border-color:var(--accent);
  background:linear-gradient(135deg,rgba(124,232,164,.12),rgba(212,175,90,.08));
  box-shadow:0 0 20px -6px rgba(124,232,164,.5);
}
.slide-icon{
  width:40px;height:40px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex-shrink:0;
  background:linear-gradient(135deg,rgba(124,232,164,.12),rgba(212,175,90,.08));
  border:1px solid rgba(124,232,164,.2);
}
.slide-text{flex:1;min-width:0}
.slide-name{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:14px;
  color:var(--text);
  line-height:1.2;
  margin-bottom:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.slide-sub{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.slide.active .slide-name{color:var(--accent)}

/* ============ МИКРОСКОП ============ */
.microscope-wrap{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  width:100%;
}
.microscope{
  position:relative;
  width:min(94%, 620px, 70vh);
  aspect-ratio:1 / 1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.scope-body{
  position:absolute;
  inset:5%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 30%, #1a2e22 0%, #0d1a14 60%, #061008 100%);
  box-shadow:
    inset 0 0 60px rgba(0,0,0,.8),
    0 20px 60px -20px rgba(0,0,0,.9),
    0 0 80px -30px rgba(124,232,164,.3);
  border:1px solid rgba(124,232,164,.12);
  pointer-events:none;
}
.scope-body::before{
  content:'';
  position:absolute;
  inset:2.5%;
  border-radius:50%;
  background:conic-gradient(from 0deg,
    rgba(124,232,164,.15) 0deg 2deg, transparent 2deg 60deg,
    rgba(124,232,164,.15) 60deg 62deg, transparent 62deg 120deg,
    rgba(124,232,164,.15) 120deg 122deg, transparent 122deg 180deg,
    rgba(124,232,164,.15) 180deg 182deg, transparent 182deg 240deg,
    rgba(124,232,164,.15) 240deg 242deg, transparent 242deg 300deg,
    rgba(124,232,164,.15) 300deg 302deg, transparent 302deg 360deg);
  animation:scopeRotate 60s linear infinite;
}
@keyframes scopeRotate{to{transform:rotate(360deg)}}

.eyepiece{
  position:relative;
  width:80%;
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
  box-shadow:
    inset 0 0 40px rgba(0,0,0,.9),
    0 0 0 10px #0a1610,
    0 0 0 12px rgba(124,232,164,.2),
    0 0 0 14px #08120c;
  touch-action: pan-y;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
}
.eyepiece:active{cursor:grabbing}
.eyepiece::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, transparent 38%, rgba(0,0,0,.5) 88%, rgba(0,0,0,.88) 100%);
  pointer-events:none;
  z-index:5;
}
#cellCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  transition:filter .35s ease, opacity .3s;
  pointer-events:none;
}

.reticle{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:4;
  opacity:.5;
}
.reticle::before,
.reticle::after{
  content:'';
  position:absolute;
  background:rgba(124,232,164,.5);
}
.reticle::before{left:50%;top:22%;width:1px;height:56%;transform:translateX(-50%)}
.reticle::after{top:50%;left:22%;height:1px;width:56%;transform:translateY(-50%)}
.reticle-mark{
  position:absolute;
  top:50%;left:50%;
  width:48px;height:48px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(124,232,164,.35);
  border-radius:50%;
}
.reticle-mark::before,
.reticle-mark::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(124,232,164,.5);
}
.reticle-mark::before{width:8px;height:1px}
.reticle-mark::after{width:1px;height:8px}

.mag-scale{
  position:absolute;
  bottom:9%;
  right:13%;
  font-family:'Playfair Display',serif;
  font-size:11px;
  color:var(--accent);
  letter-spacing:1px;
  z-index:6;
  text-shadow:0 0 8px rgba(124,232,164,.6);
  pointer-events:none;
}

/* ============ ПРАВАЯ ПАНЕЛЬ ============ */
.right-panel{
  display:flex;
  flex-direction:column;
  gap:12px;
  min-width:0;
}
.panel-card{
  padding:16px;
  border-radius:14px;
  background:rgba(15,31,24,.6);
  border:1px solid var(--line);
}
.panel-card h4{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:12.5px;
  color:var(--gold);
  letter-spacing:1px;
  margin-bottom:14px;
  font-weight:500;
}

/* ============ СЛАЙДЕРЫ ============ */
.knob-row{
  display:grid;
  grid-template-columns:52px 1fr 56px;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}
.knob-row:last-child{margin-bottom:0}
.knob-label{
  font-size:12px;
  color:var(--muted);
  letter-spacing:.5px;
}
.knob-val{
  font-family:'Playfair Display',serif;
  font-size:13px;
  color:var(--accent);
  text-align:right;
  font-weight:600;
}

.knob input[type="range"]{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:28px;
  background:transparent;
  outline:none;
  margin:0;
  padding:0;
  touch-action: auto;
}
.knob input[type="range"]::-webkit-slider-runnable-track{
  width:100%;
  height:6px;
  border-radius:50px;
  background:rgba(124,232,164,.12);
}
.knob input[type="range"]::-moz-range-track{
  width:100%;
  height:6px;
  border-radius:50px;
  background:rgba(124,232,164,.12);
}
.knob input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:26px;
  height:26px;
  border-radius:50%;
  background:linear-gradient(135deg,#7ce8a4,#d4af5a);
  border:2px solid #0b1611;
  box-shadow:0 0 12px rgba(124,232,164,.6);
  margin-top:-10px;
  cursor:pointer;
}
.knob input[type="range"]::-moz-range-thumb{
  width:26px;height:26px;
  border-radius:50%;
  background:linear-gradient(135deg,#7ce8a4,#d4af5a);
  border:2px solid #0b1611;
  box-shadow:0 0 12px rgba(124,232,164,.6);
  cursor:pointer;
}

.specimen-info h3{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:20px;
  line-height:1.15;
  margin-bottom:6px;
}
.specimen-latin{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:12px;
}
.specimen-rank{
  display:inline-block;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  padding:4px 10px;
  border-radius:50px;
  background:rgba(212,175,90,.08);
  border:1px solid rgba(212,175,90,.3);
  margin-bottom:10px;
}
.specimen-desc{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:12px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.specimen-facts{display:flex;flex-direction:column;gap:4px}
.specimen-facts>div{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  padding:7px 0;
}
.specimen-facts span{color:var(--muted)}
.specimen-facts strong{color:var(--text);font-weight:500;text-align:right}

.hints{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.hints span{
  padding:5px 10px;
  border-radius:50px;
  font-size:11px;
  color:var(--muted);
  background:rgba(124,232,164,.05);
  border:1px solid var(--line);
  line-height:1.4;
}

.observations{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.65;
}
.observations strong{color:var(--accent);font-weight:500}

.live-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding:6px 12px;
  border-radius:50px;
  background:rgba(124,232,164,.08);
  border:1px solid rgba(124,232,164,.3);
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--accent);
}
.live-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  animation:livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}

/* ============================================================
   АДАПТИВ — ПЛАНШЕТ (портрет и ландшафт до 1100px)
   ============================================================ */
@media (max-width:1100px){
  .stage{
    grid-template-columns: minmax(160px, 200px) minmax(0, 1fr);
    grid-template-areas:
      "slides microscope"
      "info   info";
    gap:14px;
  }
  .slides-panel{grid-area:slides}
  .microscope-wrap{grid-area:microscope}
  .right-panel{
    grid-area:info;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    align-items:start;
  }
  .right-panel .panel-card:nth-child(4){grid-column:1/-1}
  .microscope{width:min(96%, 560px, 60vh)}
}

/* ============================================================
   МОБИЛЬНЫЙ (телефоны портрет)
   ============================================================ */
@media (max-width:720px){
  .top-bar{padding:12px 16px}
  .brand{font-size:10.5px;letter-spacing:1.5px}
  .brand::before{display:none}
  .back-link{padding:7px 13px;font-size:12px}

  .stage{
    display:flex;
    flex-direction:column;
    padding:14px 16px 60px;
    gap:14px;
    max-width:100%;
  }

  /* Горизонтальная лента препаратов */
  .slides-panel{
    flex-direction:row;
    overflow-x:auto;
    overflow-y:hidden;
    gap:10px;
    padding:2px 16px 12px;
    margin:0 -16px;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .slides-panel::-webkit-scrollbar{display:none}
  .slides-title{display:none}
  .slide{
    min-width:150px;
    max-width:170px;
    flex-shrink:0;
    scroll-snap-align:start;
    padding:10px 12px;
    gap:10px;
  }
  .slide-icon{width:36px;height:36px;font-size:18px;border-radius:10px}
  .slide-name{font-size:13px}
  .slide-sub{font-size:10.5px}

  .microscope-wrap{
    width:100%;
    display:flex;
    justify-content:center;
  }
  .microscope{
    width:min(94vw, 60vh, 460px);
  }

  .right-panel{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
  }
  .panel-card{padding:14px}

  .knob-row{
    grid-template-columns:50px 1fr 54px;
    gap:10px;
    margin-bottom:16px;
  }
  .knob input[type="range"]{height:32px}
  .knob input[type="range"]::-webkit-slider-thumb{
    width:28px;height:28px;margin-top:-11px;
  }
  .knob input[type="range"]::-moz-range-thumb{
    width:28px;height:28px;
  }
}

/* ============================================================
   ОЧЕНЬ УЗКИЕ ЭКРАНЫ (Galaxy Fold 280px, старые устройства)
   ============================================================ */
@media (max-width:400px){
  .stage{padding:12px 12px 60px;gap:12px}
  .slides-panel{margin:0 -12px;padding-left:12px;padding-right:12px}
  .microscope{width:min(96vw, 55vh, 380px)}
  .panel-card{padding:12px}
  .specimen-info h3{font-size:17px}
  .specimen-desc{font-size:12.5px}
  .knob-row{grid-template-columns:46px 1fr 50px;gap:8px}
  .knob-label{font-size:11px}
  .knob-val{font-size:12px}
}

/* ============================================================
   КОРОТКИЕ ЭКРАНЫ ПО ВЫСОТЕ (например, планшет landscape)
   ============================================================ */
@media (max-height:600px) and (min-width:721px){
  .stage{padding-top:10px;padding-bottom:20px}
  .panel-card{padding:12px}
  .panel-card h4{margin-bottom:10px}
  .microscope{width:min(90%, 480px, 82vh)}
  .right-panel{gap:10px}
}

/* ============================================================
   ТЕЛЕФОН В ЛАНДШАФТЕ
   ============================================================ */
@media (max-width:900px) and (orientation:landscape) and (max-height:520px){
  .stage{
    display:grid;
    grid-template-columns: minmax(0, 1fr) minmax(200px, 1fr);
    grid-template-areas:
      "microscope slides"
      "microscope info";
    gap:12px;
    align-items:start;
    padding:10px 16px 20px;
  }
  .slides-panel{
    grid-area:slides;
    flex-direction:column;
    margin:0;
    padding:0;
    overflow-y:auto;
    overflow-x:hidden;
    max-height:130px;
    gap:6px;
  }
  .slide{min-width:0;max-width:none;padding:8px 10px}
  .slide-icon{width:30px;height:30px;font-size:16px;border-radius:8px}
  .slide-name{font-size:12px}
  .slide-sub{font-size:10px}
  .microscope-wrap{
    grid-area:microscope;
    align-items:flex-start;
  }
  .microscope{width:min(90%, 85vh)}
  .right-panel{
    grid-area:info;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:calc(100vh - 160px);
    overflow-y:auto;
    padding-right:4px;
  }
  .right-panel::-webkit-scrollbar{width:4px}
  .right-panel::-webkit-scrollbar-thumb{background:rgba(124,232,164,.3);border-radius:4px}
  .panel-card{padding:10px 12px}
  .panel-card h4{font-size:11px;margin-bottom:8px}
  .knob-row{grid-template-columns:44px 1fr 48px;gap:8px;margin-bottom:10px}
  .knob input[type="range"]{height:26px}
  .knob input[type="range"]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-8px}
  .specimen-info h3{font-size:15px}
  .specimen-desc{font-size:11.5px;line-height:1.5}
  .specimen-facts>div{font-size:11px;padding:5px 0}
  .hints span{font-size:10px;padding:4px 8px}
}

/* ============================================================
   ОГРОМНЫЕ ЭКРАНЫ (4K и ultrawide)
   ============================================================ */
@media (min-width:1800px){
  .stage{
    max-width:1600px;
    grid-template-columns: 280px 1fr 380px;
    gap:28px;
  }
  .microscope{width:min(90%, 720px, 68vh)}
  .specimen-info h3{font-size:22px}
  .slide-name{font-size:15px}
  .knob-label{font-size:13px}
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-link">← На главную</a>
  <div class="brand">Биология · Микроскоп</div>
</div>

<div class="stage">

  <div class="slides-panel">
    <div class="slides-title">— Препараты —</div>
    <button class="slide active" data-specimen="onion">
      <div class="slide-icon">🧅</div>
      <div class="slide-text">
        <div class="slide-name">Клетки лука</div>
        <div class="slide-sub">Растительная ткань</div>
      </div>
    </button>
    <button class="slide" data-specimen="blood">
      <div class="slide-icon">🩸</div>
      <div class="slide-text">
        <div class="slide-name">Кровь человека</div>
        <div class="slide-sub">Соединительная ткань</div>
      </div>
    </button>
    <button class="slide" data-specimen="leaf">
      <div class="slide-icon">🍃</div>
      <div class="slide-text">
        <div class="slide-name">Лист элодеи</div>
        <div class="slide-sub">Циклоз в реальном времени</div>
      </div>
    </button>
    <button class="slide" data-specimen="infusoria">
      <div class="slide-icon">🦠</div>
      <div class="slide-text">
        <div class="slide-name">Инфузория</div>
        <div class="slide-sub">Одноклеточный организм</div>
      </div>
    </button>
    <button class="slide" data-specimen="bacteria">
      <div class="slide-icon">🧫</div>
      <div class="slide-text">
        <div class="slide-name">Бактерии</div>
        <div class="slide-sub">Прокариотические клетки</div>
      </div>
    </button>
  </div>

  <div class="microscope-wrap">
    <div class="microscope">
      <div class="scope-body"></div>
      <div class="eyepiece" id="eyepiece">
        <canvas id="cellCanvas"></canvas>
        <div class="reticle">
          <div class="reticle-mark"></div>
        </div>
      </div>

  <div class="right-panel">

    <div class="panel-card">

      <h4>— Управление —</h4>

        <span>↔️ Тащи влево-вправо — двигаешь препарат</span>
        <span>↕️ Тащи вверх-вниз — скролл</span>
        <span>🔍 Зум · 🎯 Фокус · 💡 Свет</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('cellCanvas');
  const eyepiece = document.getElementById('eyepiece');
  if(!canvas || !eyepiece) return;

  const ctx = canvas.getContext('2d', { alpha: true });

  /* ============================================================
     ДАННЫЕ ПРЕПАРАТОВ
     ============================================================ */
  const SPECIMENS = {
    onion: {
      name:'Клетки кожицы лука',
      latin:'Allium cepa — epidermis',
      rank:'Растительная ткань · Epidermis',
      desc:'Классический препарат для изучения растительной клетки. Крупные прямоугольные клетки с чёткими стенками из целлюлозы. Хорошо видны ядро и вакуоль.',
      facts:[['Увеличение','×400'],['Клетки','~100 мкм'],['Окраска','Йод'],['Тип','Растительные']],
      observations:'<strong>Плотно прилегающие клетки</strong> прямоугольной формы. В центре каждой — <strong>крупное ядро</strong>. В середине клетки — большая вакуоль.',
      draw: drawOnion
    },
    blood: {
      name:'Кровь человека',
      latin:'Sanguis humanus',
      rank:'Соединительная ткань · Sanguis',
      desc:'Мазок крови — самый известный препарат. Эритроциты переносят кислород, лейкоциты защищают организм, тромбоциты отвечают за свёртывание.',
      facts:[['Увеличение','×400'],['Эритроциты','7–8 мкм'],['Норма RBC','4–5 млн/мкл'],['Цвет','Гемоглобин']],
      observations:'<strong>Красные эритроциты</strong> — двояковогнутые диски без ядра. Редкие <strong>лейкоциты</strong> — крупные белые клетки с ядром. Ещё реже — мелкие <strong>тромбоциты</strong>.',
      draw: drawBlood
    },
    leaf: {
      name:'Лист элодеи',
      latin:'Elodea canadensis — leaf',
      rank:'Растительная ткань · Folia',
      desc:'Прозрачный лист водного растения. Клетки в один слой, видны хлоропласты — зелёные органоиды фотосинтеза. Наблюдение за циклозом — классический опыт.',
      facts:[['Увеличение','×400'],['Слой','Один'],['Хлоропласты','5–10 мкм'],['Циклоз','~2 мкм/сек']],
      observations:'<strong>Прозрачные клетки</strong> с зелёными <strong>хлоропластами</strong>. Они непрерывно двигаются по кругу — это <strong>циклоз</strong>. В соседних клетках направление разное.',
      draw: drawLeafWalls,
      drawDynamic: drawLeafChloroplasts
    },
    infusoria: {
      name:'Инфузория-туфелька',
      latin:'Paramecium caudatum',
      rank:'Простейшие · Ciliophora',
      desc:'Одноклеточный организм. Форма — как подошва туфельки. Покрыта ресничками, которыми плавает и подгоняет пищу ко рту.',
      facts:[['Размер','180–300 мкм'],['Ресничек','~15 000'],['Скорость','до 2 мм/сек'],['Питание','Бактерии']],
      observations:'<strong>Крупная клетка</strong> вытянутой формы. По всей поверхности — <strong>реснички</strong>. Внутри — пульсирующие <strong>сократительные вакуоли</strong>.',
      draw: drawInfusoria
    },
    bacteria: {
      name:'Бактерии (сенная палочка)',
      latin:'Bacillus subtilis',
      rank:'Прокариоты · Bacteria',
      desc:'Прокариоты — без ядра и органоидов. Сенная палочка — классический объект. Образует споры при неблагоприятных условиях.',
      facts:[['Размер','2–5 мкм'],['Форма','Палочка'],['Движение','Жгутики'],['Споры','До 100 °C']],
      observations:'<strong>Мелкие палочки</strong>. Двигаются жгутиками. Некоторые <strong>образуют споры</strong> — светлые овальные тельца внутри.',
      draw: drawBacteria
    }
  };

  /* ============================================================
     ХЕЛПЕРЫ
     ============================================================ */
  function roundRect(c, x, y, w, h, r){
    if(w < 2 * r) r = w / 2;
    if(h < 2 * r) r = h / 2;
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }
  const seed = (i) => ((Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1 + 1) % 1;

  /* ============================================================
     РИСУНКИ ПРЕПАРАТОВ
     ВАЖНО: фоновая заливка препаратов приглушена —
     чтобы при фокусе 100% (blur=0) не было пересвета
     ============================================================ */
  function drawOnion(c){
    const w = canvas.width, h = canvas.height;
    const cellW = 130, cellH = 90;
    const cols = Math.ceil(w / cellW) + 4;
    const rows = Math.ceil(h / cellH) + 4;
    const startX = -cellW * 2;
    const startY = -cellH * 2;

    // Приглушённый фон (было 0.15 — стало 0.05)
    c.fillStyle = 'rgba(255,235,200,0.05)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    for(let i = 0; i < cols; i++){
      for(let j = 0; j < rows; j++){
        const x = startX + i * cellW;
        const y = startY + j * cellH;

        c.strokeStyle = 'rgba(212,175,90,0.65)';
        c.lineWidth = 2.2;
        c.beginPath();
        roundRect(c, x, y, cellW - 6, cellH - 6, 6);
        c.stroke();

        c.strokeStyle = 'rgba(212,175,90,0.3)';
        c.lineWidth = 1;
        c.beginPath();
        roundRect(c, x + 4, y + 4, cellW - 14, cellH - 14, 4);
        c.stroke();

        const nx = x + cellW / 2;
        const ny = y + cellH / 2;
        c.fillStyle = 'rgba(200,230,255,0.08)';
        c.beginPath();
        c.ellipse(nx, ny, cellW / 2 - 30, cellH / 2 - 22, 0, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = 'rgba(180,140,230,0.8)';
        c.beginPath();
        c.arc(nx, ny, 13, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = 'rgba(230,200,255,0.85)';
        c.beginPath();
        c.arc(nx - 3, ny - 3, 4, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = 'rgba(230,140,180,0.85)';
        c.beginPath();
        c.arc(nx + 5, ny + 5, 3, 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  function drawBlood(c){
    const w = canvas.width, h = canvas.height;
    c.fillStyle = 'rgba(255,235,225,0.04)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    for(let i = 0; i < 200; i++){
      const x = seed(i) * w * 3 - w;
      const y = seed(i + 1000) * h * 3 - h;
      const r = 10 + seed(i + 2000) * 3;

      c.fillStyle = 'rgba(180,30,50,0.12)';
      c.beginPath();
      c.arc(x + 2, y + 2, r + 1, 0, Math.PI * 2);
      c.fill();

      const grad = c.createRadialGradient(x, y, 1, x, y, r);
      grad.addColorStop(0, 'rgba(200,70,90,0.5)');
      grad.addColorStop(0.7, 'rgba(180,45,75,0.82)');
      grad.addColorStop(1, 'rgba(130,15,45,0.88)');
      c.fillStyle = grad;
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(255,190,200,0.28)';
      c.beginPath();
      c.arc(x, y, r * 0.55, 0, Math.PI * 2);
      c.fill();
    }

    for(let i = 0; i < 3; i++){
      const x = (0.2 + seed(i + 3000) * 0.6) * w;
      const y = (0.2 + seed(i + 4000) * 0.6) * h;
      const r = 22;
      c.fillStyle = 'rgba(190,215,255,0.12)';
      c.beginPath();
      c.arc(x, y, r + 6, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(200,215,245,0.6)';
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(110,75,170,0.82)';
      c.beginPath();
      for(let a = 0; a < Math.PI * 2; a += Math.PI / 8){
        const rr = 9 + Math.sin(a * 3 + i) * 4;
        const px = x + Math.cos(a) * rr;
        const py = y + Math.sin(a) * rr;
        if(a === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
    }

    for(let i = 0; i < 30; i++){
      const x = seed(i + 5000) * w * 3 - w;
      const y = seed(i + 6000) * h * 3 - h;
      c.fillStyle = 'rgba(220,190,140,0.55)';
      c.beginPath();
      c.ellipse(x, y, 3.5, 2, seed(i + 7000) * Math.PI, 0, Math.PI * 2);
      c.fill();
    }
  }

  function drawLeafWalls(c){
    const w = canvas.width, h = canvas.height;
    c.fillStyle = 'rgba(225,240,215,0.05)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    const cellW = 120, cellH = 80;
    const cols = Math.ceil(w / cellW) + 4;
    const rows = Math.ceil(h / cellH) + 4;
    const startX = -cellW * 2;
    const startY = -cellH * 2;

    for(let i = 0; i < cols; i++){
      for(let j = 0; j < rows; j++){
        const x = startX + i * cellW;
        const y = startY + j * cellH;

        c.strokeStyle = 'rgba(110,170,90,0.55)';
        c.lineWidth = 2;
        c.beginPath();
        roundRect(c, x + 4, y + 4, cellW - 8, cellH - 8, 10);
        c.stroke();

        c.strokeStyle = 'rgba(110,170,90,0.18)';
        c.lineWidth = 1;
        c.beginPath();
        roundRect(c, x + 8, y + 8, cellW - 16, cellH - 16, 8);
        c.stroke();

        c.fillStyle = 'rgba(170,130,210,0.6)';
        c.beginPath();
        c.arc(x + 22, y + cellH / 2, 6.5, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = 'rgba(210,175,245,0.8)';
        c.beginPath();
        c.arc(x + 22, y + cellH / 2, 2.3, 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  function drawLeafChloroplasts(c, time){
    const list = leafState.chloroplasts;
    for(let i = 0; i < list.length; i++){
      const ch = list[i];
      const wobble = Math.sin(time * ch.wobbleSpeed + ch.wobble) * 1.2;
      const x = ch.cx + Math.cos(ch.angle) * ch.rx + ch.jitterX;
      const y = ch.cy + Math.sin(ch.angle) * ch.ry + ch.jitterY + wobble;

      c.save();
      c.translate(x, y);
      c.rotate(ch.rot + ch.angle * 0.35);

      c.fillStyle = 'rgba(20,60,30,0.22)';
      c.beginPath();
      c.ellipse(1, 1, ch.sizeX, ch.sizeY, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(50,140,70,0.92)';
      c.beginPath();
      c.ellipse(0, 0, ch.sizeX, ch.sizeY, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(160,225,130,0.65)';
      c.beginPath();
      c.ellipse(-ch.sizeX * 0.32, -ch.sizeY * 0.32, ch.sizeX * 0.5, ch.sizeY * 0.42, 0, 0, Math.PI * 2);
      c.fill();

      c.restore();
    }
  }

  function drawInfusoria(c){
    const w = canvas.width, h = canvas.height;
    c.fillStyle = 'rgba(215,235,225,0.05)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    for(let n = 0; n < 3; n++){
      const x = w * (0.25 + seed(n + 100) * 0.5);
      const y = h * (0.25 + seed(n + 200) * 0.5);
      const angle = seed(n + 300) * Math.PI * 2;
      const scale = 0.75 + seed(n + 400) * 0.4;

      c.save();
      c.translate(x, y);
      c.rotate(angle);
      c.scale(scale, scale);

      const rx = 110, ry = 50;

      c.fillStyle = 'rgba(40,80,60,0.25)';
      c.beginPath();
      c.ellipse(3, 3, rx, ry, 0, 0, Math.PI * 2);
      c.fill();

      const grad = c.createRadialGradient(-20, -15, 5, 0, 0, rx);
      grad.addColorStop(0, 'rgba(210,240,220,0.85)');
      grad.addColorStop(0.5, 'rgba(150,210,170,0.8)');
      grad.addColorStop(1, 'rgba(75,140,105,0.82)');
      c.fillStyle = grad;
      c.beginPath();
      c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = 'rgba(60,120,90,0.65)';
      c.lineWidth = 1.5;
      c.stroke();

      c.strokeStyle = 'rgba(90,140,110,0.65)';
      c.lineWidth = 1;
      for(let a = 0; a < Math.PI * 2; a += 0.15){
        const cxs = Math.cos(a) * rx;
        const cys = Math.sin(a) * ry;
        c.beginPath();
        c.moveTo(cxs, cys);
        c.lineTo(cxs + Math.cos(a) * 10, cys + Math.sin(a) * 10);
        c.stroke();
      }

      c.fillStyle = 'rgba(140,200,255,0.5)';
      c.beginPath();
      c.arc(-35, -15, 10, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.arc(30, 15, 10, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(170,115,210,0.68)';
      c.beginPath();
      c.ellipse(0, 0, 18, 13, 0, 0, Math.PI * 2);
      c.fill();

      c.restore();
    }
  }

  function drawBacteria(c){
    const w = canvas.width, h = canvas.height;
    c.fillStyle = 'rgba(225,235,215,0.05)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    for(let i = 0; i < 55; i++){
      const x = seed(i) * w * 3 - w;
      const y = seed(i + 1000) * h * 3 - h;
      const angle = seed(i + 2000) * Math.PI * 2;
      const len = 45 + seed(i + 3000) * 25;
      const wid = 12 + seed(i + 4000) * 4;

      c.save();
      c.translate(x, y);
      c.rotate(angle);

      c.fillStyle = 'rgba(60,80,50,0.2)';
      c.beginPath();
      c.ellipse(2, 2, len / 2 + 3, wid / 2 + 2, 0, 0, Math.PI * 2);
      c.fill();

      const grad = c.createLinearGradient(-len/2, 0, len/2, 0);
      grad.addColorStop(0, 'rgba(190,220,180,0.82)');
      grad.addColorStop(0.5, 'rgba(220,238,210,0.88)');
      grad.addColorStop(1, 'rgba(170,200,160,0.82)');
      c.fillStyle = grad;
      c.beginPath();
      c.ellipse(0, 0, len / 2, wid / 2, 0, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = 'rgba(90,140,80,0.65)';
      c.lineWidth = 1.4;
      c.stroke();

      if(seed(i + 5000) > 0.4){
        c.strokeStyle = 'rgba(120,160,100,0.5)';
        c.lineWidth = 1.2;
        c.beginPath();
        c.moveTo(len / 2, 0);
        for(let t = 0; t < 35; t += 4){
          c.lineTo(len / 2 + t, Math.sin(t * 0.4 + i) * 5);
        }
        c.stroke();
      }

      c.restore();
    }

    for(let i = 0; i < 5; i++){
      const x = seed(i + 7000) * w * 3 - w;
      const y = seed(i + 8000) * h * 3 - h;
      c.fillStyle = 'rgba(245,245,230,0.65)';
      c.beginPath();
      c.arc(x, y, 9, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = 'rgba(175,175,140,0.65)';
      c.lineWidth = 1.3;
      c.stroke();
    }
  }

  /* ============================================================
     АНИМАЦИЯ ЦИКЛОЗА
     ============================================================ */
  const leafState = { initialized: false, chloroplasts: [], elapsed: 0 };

  function initLeafState(){
    const w = canvas.width, h = canvas.height;
    const cellW = 120, cellH = 80;
    const cols = Math.ceil(w / cellW) + 4;
    const rows = Math.ceil(h / cellH) + 4;
    const startX = -cellW * 2;
    const startY = -cellH * 2;

    leafState.chloroplasts = [];

    for(let i = 0; i < cols; i++){
      for(let j = 0; j < rows; j++){
        const cx = startX + i * cellW + cellW / 2;
        const cy = startY + j * cellH + cellH / 2;
        const count = 8 + Math.floor(Math.random() * 4);
        const dir = ((i + j) % 2 === 0) ? 1 : -1;

        for(let k = 0; k < count; k++){
          const rx = cellW / 2 - 22 - Math.random() * 6;
          const ry = cellH / 2 - 16 - Math.random() * 5;

          leafState.chloroplasts.push({
            cx, cy, rx, ry,
            angle: Math.random() * Math.PI * 2,
            speed: (0.25 + Math.random() * 0.15) * dir,
            sizeX: 7 + Math.random() * 2.5,
            sizeY: 4 + Math.random() * 1.5,
            rot: Math.random() * Math.PI,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.6 + Math.random() * 0.9,
            jitterX: (Math.random() - 0.5) * 3,
            jitterY: (Math.random() - 0.5) * 3
          });
        }
      }
    }
    leafState.initialized = true;
  }

  function updateLeafAnimation(dt){
    const list = leafState.chloroplasts;
    for(let i = 0; i < list.length; i++){
      list[i].angle += list[i].speed * dt;
    }
  }

  let leafAnimFrame = null;
  let leafLastTime = 0;

  function leafAnimLoop(now){
    if(state.specimen !== 'leaf'){
      leafAnimFrame = null;
      return;
    }
    const dt = Math.min(0.05, (now - leafLastTime) / 1000 || 0.016);
    leafLastTime = now;
    leafState.elapsed += dt;

    updateLeafAnimation(dt);
    render();
    leafAnimFrame = requestAnimationFrame(leafAnimLoop);
  }

  function ensureLeafAnim(){
    if(state.specimen === 'leaf' && !leafAnimFrame){
      leafLastTime = performance.now();
      leafAnimFrame = requestAnimationFrame(leafAnimLoop);
    }
  }

  /* ============================================================
     РАЗМЕР CANVAS
     ============================================================ */
  let currentW = 0, currentH = 0;

  function resizeCanvas(){
    const rect = eyepiece.getBoundingClientRect();
    const w = Math.round(rect.width);
    const h = Math.round(rect.height);
    if(w === 0 || h === 0) return;

    const isSmall = w < 500;
    const maxDpr = isSmall ? 1.5 : 2;
    const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);

    if(currentW === w && currentH === h) return;
    currentW = w;
    currentH = h;

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    leafState.initialized = false;
    if(state.specimen === 'leaf') initLeafState();

    render();
  }

  if(window.ResizeObserver){
    const ro = new ResizeObserver(() => {
      currentW = 0;
      resizeCanvas();
    });
    ro.observe(eyepiece);
  }
  window.addEventListener('resize', () => { currentW = 0; resizeCanvas(); });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { currentW = 0; resizeCanvas(); }, 250);
  });

  /* ============================================================
     СОСТОЯНИЕ
     ============================================================ */
  const state = {
    specimen: 'onion',
    zoom: 400,
    focus: 100,
    light: 90,
    offsetX: 0,
    offsetY: 0
  };

  const zoomRange = document.getElementById('zoomRange');
  const focusRange = document.getElementById('focusRange');
  const lightRange = document.getElementById('lightRange');
  const zoomVal = document.getElementById('zoomVal');
  const focusVal = document.getElementById('focusVal');
  const lightVal = document.getElementById('lightVal');
  const magScale = document.getElementById('magScale');

  /* ============================================================
     РЕНДЕР — с НОВОЙ формулой яркости
     ============================================================ */
  function render(){
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if(w === 0 || h === 0) return;

    ctx.clearRect(0, 0, w, h);

    // Фон линзы — приглушённый, не зависит от state.light (чтобы не было засветки)
    const bg = ctx.createRadialGradient(w / 2, h / 2, 20, w / 2, h / 2, Math.max(w, h) * 0.7);
    bg.addColorStop(0, 'rgba(245,250,235,0.06)');
    bg.addColorStop(1, 'rgba(15,35,25,0.35)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const spec = SPECIMENS[state.specimen];
    if(spec && spec.draw){
      if(state.specimen === 'leaf' && !leafState.initialized){
        initLeafState();
      }

      const zoomScale = state.zoom / 400;
      const offX = state.offsetX;
      const offY = state.offsetY;

      // Дальний слой — слабое свечение контекста
      ctx.save();
      ctx.translate(w / 2 + offX * 0.4, h / 2 + offY * 0.4);
      ctx.scale(zoomScale * 0.9, zoomScale * 0.9);
      ctx.translate(-w / 2, -h / 2);
      ctx.globalAlpha = 0.3;
      spec.draw(ctx);
      ctx.restore();

      // Основной слой
      ctx.save();
      ctx.translate(w / 2 + offX, h / 2 + offY);
      ctx.scale(zoomScale, zoomScale);
      ctx.translate(-w / 2, -h / 2);
      spec.draw(ctx);
      if(spec.drawDynamic){
        spec.drawDynamic(ctx, leafState.elapsed);
      }
      ctx.restore();

      // Передний слой (параллакс)
      if(state.specimen === 'infusoria' || state.specimen === 'bacteria'){
        ctx.save();
        ctx.translate(w / 2 + offX * 1.5, h / 2 + offY * 1.5);
        ctx.scale(zoomScale * 1.2, zoomScale * 1.2);
        ctx.translate(-w / 2, -h / 2);
        ctx.globalAlpha = 0.22;
        spec.draw(ctx);
        ctx.restore();
      }
    }

    // Виньетка
    const vig = ctx.createRadialGradient(w / 2, h / 2, w * 0.32, w / 2, h / 2, w * 0.55);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);

    /* ========== ГЛАВНОЕ ИСПРАВЛЕНИЕ ==========
       Было: brightness = light/100 → при 150 = 1.5 (засветка!)
       Стало: brightness ограничен [0.55 … 1.05]
       blur мягче: max 4.5 вместо 6
       contrast убран, saturate нейтральный
       ========================================= */
    const blur = (100 - state.focus) * 0.045;
    const brightness = 0.55 + (state.light - 30) / 120 * 0.5; // 0.55 … 1.05
    canvas.style.filter = `blur(${blur}px) brightness(${brightness})`;

    if(state.specimen === 'leaf'){
      ensureLeafAnim();
    }
  }

  /* ============================================================
     СЛАЙДЕРЫ
     ============================================================ */
  zoomRange.addEventListener('input', () => {
    state.zoom = +zoomRange.value;
    zoomVal.textContent = '×' + state.zoom;
    magScale.textContent = '×' + state.zoom;
    render();
  });
  focusRange.addEventListener('input', () => {
    state.focus = +focusRange.value;
    focusVal.textContent = state.focus + '%';
    render();
  });
  lightRange.addEventListener('input', () => {
    state.light = +lightRange.value;
    lightVal.textContent = state.light + '%';
    render();
  });

  /* ============================================================
     УМНОЕ ПЕРЕТАСКИВАНИЕ
     ============================================================ */
  let touchState = null;

  eyepiece.addEventListener('pointerdown', (e) => {
    if(e.target.closest('input')) return;
    touchState = {
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      baseX: state.offsetX,
      baseY: state.offsetY,
      decided: false,
      isDragging: false
    };
  });

  eyepiece.addEventListener('pointermove', (e) => {
    if(!touchState || e.pointerId !== touchState.pointerId) return;

    const dx = e.clientX - touchState.startX;
    const dy = e.clientY - touchState.startY;

    if(!touchState.decided){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      touchState.decided = true;
      if(Math.abs(dx) > Math.abs(dy)){
        touchState.isDragging = true;
        try { eyepiece.setPointerCapture(e.pointerId); } catch(_) {}
      } else {
        touchState = null;
        return;
      }
    }

    if(touchState.isDragging){
      e.preventDefault();
      state.offsetX = touchState.baseX + dx;
      state.offsetY = touchState.baseY + dy;
      render();
    }
  }, { passive: false });

  function endTouch(e){
    if(!touchState) return;
    if(e && e.pointerId !== touchState.pointerId) return;
    touchState = null;
  }
  eyepiece.addEventListener('pointerup', endTouch);
  eyepiece.addEventListener('pointercancel', endTouch);
  eyepiece.addEventListener('lostpointercapture', endTouch);

  /* ============================================================
     ЗУМ КОЛЁСИКОМ
     ============================================================ */
  eyepiece.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.5;
    state.zoom = Math.max(40, Math.min(400, state.zoom + delta));
    zoomRange.value = Math.round(state.zoom);
    zoomVal.textContent = '×' + Math.round(state.zoom);
    magScale.textContent = '×' + Math.round(state.zoom);
    render();
  }, { passive: false });

  /* ============================================================
     СМЕНА ПРЕПАРАТА
     ============================================================ */
  document.querySelectorAll('.slide').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.slide').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      state.specimen = btn.dataset.specimen;
      state.offsetX = 0;
      state.offsetY = 0;

      if(state.specimen === 'leaf'){
        leafState.initialized = false;
        leafState.elapsed = 0;
      } else {
        if(leafAnimFrame){
          cancelAnimationFrame(leafAnimFrame);
          leafAnimFrame = null;
        }
      }

      canvas.style.opacity = '0.15';
      setTimeout(() => {
        render();
        canvas.style.opacity = '1';
      }, 160);

      const liveBadge = document.getElementById('liveBadge');
      if(liveBadge){
        liveBadge.style.display = (state.specimen === 'leaf') ? 'inline-flex' : 'none';
      }

      updateSpecimenInfo(state.specimen);
    });
  });

  /* ============================================================
     ИНФО
     ============================================================ */
  function updateSpecimenInfo(key){
    const s = SPECIMENS[key];
    if(!s) return;
    document.getElementById('specimenRank').textContent = s.rank;
    document.getElementById('specimenName').textContent = s.name;
    document.getElementById('specimenLatin').textContent = s.latin;
    document.getElementById('specimenDesc').textContent = s.desc;
    document.getElementById('specimenFacts').innerHTML = s.facts
      .map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`)
      .join('');
    document.getElementById('observations').innerHTML = s.observations;
  }

  /* ============================================================
     СТАРТ
     ============================================================ */
  updateSpecimenInfo('onion');

  requestAnimationFrame(() => {
    resizeCanvas();
    setTimeout(resizeCanvas, 200);
    setTimeout(resizeCanvas, 600);
  });

  // Анимация наводки на резкость
  setTimeout(() => {
    state.focus = 30;
    focusRange.value = 30;
    focusVal.textContent = '30%';
    render();

    let f = 30;
    const int = setInterval(() => {
      f += 4;
      if(f >= 100){
        f = 100;
        clearInterval(int);
      }
      state.focus = f;
      focusRange.value = f;
      focusVal.textContent = f + '%';
      render();
    }, 30);
  }, 500);

})();
</script>
</body>
</html>
