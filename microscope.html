<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Виртуальный микроскоп — Ресурсный центр «Биология»</title>
<meta name="description" content="Виртуальный микроскоп с препаратами: клетки лука, кровь, инфузория. Циклоз в листе элодеи в реальном времени." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1611;
  --bg-2:#0f1f18;
  --panel:rgba(15,31,24,.94);
  --accent:#7ce8a4;
  --accent-2:#4dd18a;
  --gold:#d4af5a;
  --pink:#e88ba5;
  --purple:#b58ce8;
  --text:#f0e9d8;
  --muted:#8ea79a;
  --line:rgba(124,232,164,.18);
  --grad:linear-gradient(135deg,#7ce8a4 0%,#d4af5a 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(124,232,164,.05), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(212,175,90,.05), transparent 45%);
  z-index:0;
  pointer-events:none;
}

.top-bar{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  padding:18px 6vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}
.top-bar>*{pointer-events:auto}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:9px 18px;
  border-radius:50px;
  border:1px solid var(--line);
  font-size:13px;
  color:var(--muted);
  transition:all .3s;
  background:rgba(15,31,24,.6);
  backdrop-filter:blur(8px);
}
.back-link:hover{
  color:var(--accent);
  border-color:rgba(124,232,164,.4);
  transform:translateX(-3px);
}
.brand{
  font-family:'Playfair Display',serif;
  font-size:14px;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:10px;
}
.brand::before{
  content:'';
  width:8px;height:8px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 12px var(--accent);
  animation:pulseDot 2.4s infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(1.4)}
}

.stage{
  position:relative;
  z-index:1;
  height:100vh;
  display:grid;
  grid-template-columns: 260px 1fr 340px;
  gap:24px;
  padding:90px 6vw 40px;
  align-items:center;
}

.slides-panel{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.slides-title{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:14px;
  color:var(--gold);
  letter-spacing:1px;
  margin-bottom:4px;
}
.slide{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 16px;
  border-radius:16px;
  background:rgba(15,31,24,.65);
  border:1px solid var(--line);
  backdrop-filter:blur(8px);
  transition:all .3s;
  text-align:left;
  font-size:13px;
}
.slide:hover{
  border-color:rgba(124,232,164,.4);
  transform:translateX(4px);
}
.slide.active{
  border-color:var(--accent);
  background:linear-gradient(135deg,rgba(124,232,164,.1),rgba(212,175,90,.08));
  box-shadow:0 0 20px -5px rgba(124,232,164,.4);
}
.slide-icon{
  width:44px;height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-shrink:0;
  background:linear-gradient(135deg,rgba(124,232,164,.12),rgba(212,175,90,.08));
  border:1px solid rgba(124,232,164,.2);
}
.slide-text{flex:1;min-width:0}
.slide-name{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:14.5px;
  color:var(--text);
  line-height:1.2;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.slide-sub{
  font-size:11.5px;
  color:var(--muted);
  letter-spacing:.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.slide.active .slide-name{color:var(--accent)}

.microscope{
  position:relative;
  width:100%;
  max-width:720px;
  aspect-ratio: 1 / 1;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
}

.scope-body{
  position:absolute;
  inset:6%;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 30%, #1a2e22 0%, #0d1a14 60%, #061008 100%);
  box-shadow:
    inset 0 0 60px rgba(0,0,0,.8),
    inset 0 0 20px rgba(124,232,164,.06),
    0 30px 80px -20px rgba(0,0,0,.9),
    0 0 100px -30px rgba(124,232,164,.3);
  border:1px solid rgba(124,232,164,.12);
}
.scope-body::before{
  content:'';
  position:absolute;
  inset:2.5%;
  border-radius:50%;
  background:
    conic-gradient(from 0deg,
      rgba(124,232,164,.15) 0deg 2deg, transparent 2deg 60deg,
      rgba(124,232,164,.15) 60deg 62deg, transparent 62deg 120deg,
      rgba(124,232,164,.15) 120deg 122deg, transparent 122deg 180deg,
      rgba(124,232,164,.15) 180deg 182deg, transparent 182deg 240deg,
      rgba(124,232,164,.15) 240deg 242deg, transparent 242deg 300deg,
      rgba(124,232,164,.15) 300deg 302deg, transparent 302deg 360deg);
  animation:scopeRotate 60s linear infinite;
  pointer-events:none;
}
.scope-body::after{
  content:'';
  position:absolute;
  inset:6%;
  border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg,
      rgba(212,175,90,.2) 0deg 1deg,
      transparent 1deg 30deg);
  opacity:.4;
  pointer-events:none;
}
@keyframes scopeRotate{to{transform:rotate(360deg)}}

.eyepiece{
  position:relative;
  width:78%;
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
  box-shadow:
    inset 0 0 40px rgba(0,0,0,.9),
    0 0 0 12px #0a1610,
    0 0 0 14px rgba(124,232,164,.2),
    0 0 0 16px #08120c;
  cursor:grab;
  transition:box-shadow .3s;
}
.eyepiece:active{cursor:grabbing}
.eyepiece::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,.5) 90%, rgba(0,0,0,.85) 100%);
  pointer-events:none;
  z-index:5;
}
#cellCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  transition:filter .3s;
}

.reticle{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:4;
  opacity:.6;
}
.reticle::before,
.reticle::after{
  content:'';
  position:absolute;
  background:rgba(124,232,164,.5);
}
.reticle::before{
  left:50%;top:20%;
  width:1px;height:60%;
  transform:translateX(-50%);
}
.reticle::after{
  top:50%;left:20%;
  height:1px;width:60%;
  transform:translateY(-50%);
}
.reticle-mark{
  position:absolute;
  top:50%;left:50%;
  width:56px;height:56px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(124,232,164,.35);
  border-radius:50%;
}
.reticle-mark::before,
.reticle-mark::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(124,232,164,.5);
}
.reticle-mark::before{width:8px;height:1px}
.reticle-mark::after{width:1px;height:8px}

.mag-scale{
  position:absolute;
  bottom:8%;
  right:12%;
  font-family:'Playfair Display',serif;
  font-size:12px;
  color:var(--accent);
  letter-spacing:1px;
  z-index:6;
  text-shadow:0 0 8px rgba(124,232,164,.6);
}

.right-panel{
  display:flex;
  flex-direction:column;
  gap:14px;
  max-height:calc(100vh - 140px);
  overflow-y:auto;
  padding-right:4px;
}
.right-panel::-webkit-scrollbar{width:4px}
.right-panel::-webkit-scrollbar-thumb{background:rgba(124,232,164,.2);border-radius:50px}

.panel-card{
  padding:18px 18px;
  border-radius:16px;
  background:rgba(15,31,24,.65);
  border:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.panel-card h4{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:13px;
  color:var(--gold);
  letter-spacing:1px;
  margin-bottom:14px;
  font-weight:500;
}

.knob-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}
.knob-row:last-child{margin-bottom:0}
.knob-label{
  font-size:12px;
  color:var(--muted);
  letter-spacing:.5px;
  width:52px;
  flex-shrink:0;
}
.knob-val{
  font-family:'Playfair Display',serif;
  font-size:14px;
  color:var(--accent);
  width:56px;
  text-align:right;
  flex-shrink:0;
  font-weight:600;
}
.knob{
  flex:1;
  position:relative;
  height:6px;
  border-radius:50px;
  background:rgba(124,232,164,.1);
  overflow:hidden;
}
.knob input[type="range"]{
  position:absolute;
  inset:-10px 0;
  width:100%;
  height:26px;
  background:transparent;
  -webkit-appearance:none;
  appearance:none;
  cursor:pointer;
  outline:none;
}
.knob input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:20px;height:20px;
  border-radius:50%;
  background:var(--grad);
  border:2px solid #0b1611;
  box-shadow:0 0 12px rgba(124,232,164,.6);
  cursor:grab;
  transition:transform .2s;
}
.knob input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.knob input[type="range"]::-moz-range-thumb{
  width:20px;height:20px;
  border-radius:50%;
  background:var(--accent);
  border:2px solid #0b1611;
  box-shadow:0 0 12px rgba(124,232,164,.6);
  cursor:grab;
  border:none;
}
.knob-fill{
  position:absolute;
  top:0;left:0;bottom:0;
  background:var(--grad);
  border-radius:50px;
  pointer-events:none;
}

.specimen-info h3{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:22px;
  line-height:1.15;
  margin-bottom:6px;
  color:var(--text);
}
.specimen-latin{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:12.5px;
  color:var(--muted);
  display:block;
  margin-bottom:14px;
}
.specimen-rank{
  display:inline-block;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  padding:4px 10px;
  border-radius:50px;
  background:rgba(212,175,90,.08);
  border:1px solid rgba(212,175,90,.3);
  margin-bottom:12px;
}
.specimen-desc{
  font-size:13px;
  color:var(--muted);
  line-height:1.65;
  margin-bottom:14px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.specimen-facts{display:flex;flex-direction:column;gap:6px}
.specimen-facts>div{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  padding:8px 0;
}
.specimen-facts span{color:var(--muted)}
.specimen-facts strong{color:var(--text);font-weight:500;text-align:right}

.hints{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.hints span{
  padding:5px 10px;
  border-radius:50px;
  font-size:11px;
  color:var(--muted);
  background:rgba(124,232,164,.05);
  border:1px solid var(--line);
}

.observations{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.7;
}
.observations strong{color:var(--accent);font-weight:500}

.live-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  padding:6px 14px;
  border-radius:50px;
  background:rgba(124,232,164,.08);
  border:1px solid rgba(124,232,164,.3);
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--accent);
}
.live-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  animation:livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}

@media (max-width:1100px){
  .stage{
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    padding:80px 5vw 30px;
    gap:16px;
    overflow-y:auto;
    height:auto;
    min-height:100vh;
    align-items:start;
  }
  .microscope{max-width:520px}
  .slides-panel{
    flex-direction:row;
    overflow-x:auto;
    padding-bottom:6px;
  }
  .slides-panel::-webkit-scrollbar{height:4px}
  .slides-panel::-webkit-scrollbar-thumb{background:rgba(124,232,164,.2);border-radius:50px}
  .slides-title{display:none}
  .slide{min-width:170px;flex-shrink:0}
  .right-panel{max-height:none}
  .eyepiece{width:90%}
}
@media (max-width:600px){
  .brand{display:none}
  .stage{padding:70px 16px 24px}
  .slide-icon{width:36px;height:36px;font-size:18px}
  .slide-name{font-size:13px}
  .knob-label{width:44px;font-size:11px}
  .knob-val{width:48px;font-size:12.5px}
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-link">На главную</a>
  <div class="brand">Ресурсный центр · Биология</div>
</div>

<div class="stage">

  <div class="slides-panel">
    <div class="slides-title">— Препараты —</div>
    <button class="slide active" data-specimen="onion">
      <div class="slide-icon">🧅</div>
      <div class="slide-text">
        <div class="slide-name">Клетки лука</div>
        <div class="slide-sub">Растительная ткань</div>
      </div>
    </button>
    <button class="slide" data-specimen="blood">
      <div class="slide-icon">🩸</div>
      <div class="slide-text">
        <div class="slide-name">Кровь человека</div>
        <div class="slide-sub">Соединительная ткань</div>
      </div>
    </button>
    <button class="slide" data-specimen="leaf">
      <div class="slide-icon">🍃</div>
      <div class="slide-text">
        <div class="slide-name">Лист элодеи</div>
        <div class="slide-sub">Циклоз в реальном времени</div>
      </div>
    </button>
    <button class="slide" data-specimen="infusoria">
      <div class="slide-icon">🦠</div>
      <div class="slide-text">
        <div class="slide-name">Инфузория-туфелька</div>
        <div class="slide-sub">Одноклеточный организм</div>
      </div>
    </button>
    <button class="slide" data-specimen="bacteria">
      <div class="slide-icon">🧫</div>
      <div class="slide-text">
        <div class="slide-name">Бактерии</div>
        <div class="slide-sub">Прокариотические клетки</div>
      </div>
    </button>
  </div>

  <div class="microscope">
    <div class="scope-body"></div>
    <div class="eyepiece" id="eyepiece">
      <canvas id="cellCanvas"></canvas>
      <div class="reticle">
        <div class="reticle-mark"></div>
      </div>
    </div>
    <div class="mag-scale" id="magScale">×400</div>
  </div>

  <div class="right-panel">

    <div class="panel-card">
      <h4>— Настройки —</h4>
      <div class="knob-row">
        <span class="knob-label">Зум</span>
        <div class="knob">
          <div class="knob-fill" id="zoomFill" style="width:100%"></div>
          <input type="range" id="zoomRange" min="40" max="400" value="400" step="10" />
        </div>
        <span class="knob-val" id="zoomVal">×400</span>
      </div>
      <div class="knob-row">
        <span class="knob-label">Фокус</span>
        <div class="knob">
          <div class="knob-fill" id="focusFill" style="width:100%"></div>
          <input type="range" id="focusRange" min="0" max="100" value="100" />
        </div>
        <span class="knob-val" id="focusVal">100%</span>
      </div>
      <div class="knob-row">
        <span class="knob-label">Свет</span>
        <div class="knob">
          <div class="knob-fill" id="lightFill" style="width:90%"></div>
          <input type="range" id="lightRange" min="30" max="150" value="90" />
        </div>
        <span class="knob-val" id="lightVal">90%</span>
      </div>
    </div>

    <div class="panel-card specimen-info">
      <span class="specimen-rank" id="specimenRank"></span>
      <h3 id="specimenName"></h3>
      <em class="specimen-latin" id="specimenLatin"></em>
      <p class="specimen-desc" id="specimenDesc"></p>
      <div class="specimen-facts" id="specimenFacts"></div>
    </div>

    <div class="panel-card">
      <h4>— В поле зрения —</h4>
      <div class="observations" id="observations"></div>
      <div class="live-badge" id="liveBadge" style="display:none">
        <span class="live-dot"></span> Циклоз активен
      </div>
    </div>

    <div class="panel-card">
      <h4>— Управление —</h4>
      <div class="hints">
        <span>🖱 Тяни окуляр — двигай препарат</span>
        <span>🔍 Зум — крутилка</span>
        <span>🎯 Фокус — резкость</span>
        <span>💡 Свет — яркость</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('cellCanvas');
  const eyepiece = document.getElementById('eyepiece');
  if(!canvas || !eyepiece) return;

  const ctx = canvas.getContext('2d');

  /* ---------- ДАННЫЕ ПРЕПАРАТОВ ---------- */
  const SPECIMENS = {
    onion: {
      name:'Клетки кожицы лука',
      latin:'Allium cepa — epidermis',
      rank:'Растительная ткань · Epidermis',
      desc:'Классический препарат для изучения растительной клетки. Крупные прямоугольные клетки с чёткими стенками из целлюлозы. Хорошо видны ядро и вакуоль.',
      facts:[
        ['Увеличение','×400'],
        ['Клетки','~100 мкм'],
        ['Окраска','Йод / метилен'],
        ['Класс','Растительные']
      ],
      observations:'<strong>Ряд плотно прилегающих клеток</strong> прямоугольной формы. В центре каждой — <strong>крупное ядро</strong>. Цитоплазма сдвинута к стенкам, в середине — большая вакуоль.',
      draw: drawOnion
    },
    blood: {
      name:'Кровь человека',
      latin:'Sanguis humanus',
      rank:'Соединительная ткань · Sanguis',
      desc:'Мазок крови — самый известный препарат. Эритроциты переносят кислород, лейкоциты защищают организм, тромбоциты отвечают за свёртывание.',
      facts:[
        ['Увеличение','×400'],
        ['Эритроциты','7–8 мкм'],
        ['Норма RBC','4–5 млн/мкл'],
        ['Цвет','Красный (гемоглобин)']
      ],
      observations:'<strong>Множество красных эритроцитов</strong> — двояковогнутых дисков без ядра. Редкие <strong>лейкоциты</strong> — крупные белые клетки с ядром. Ещё реже — <strong>тромбоциты</strong> — мелкие пластинки.',
      draw: drawBlood
    },
    leaf: {
      name:'Лист элодеи',

  /* ---------- РИСУНКИ ПРЕПАРАТОВ ---------- */
  function drawOnion(c){
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2;
    const cellW = 160, cellH = 110;
    const cols = 10, rows = 8;
    const startX = cx - (cols * cellW) / 2;
    const startY = cy - (rows * cellH) / 2;

    c.fillStyle = 'rgba(255,240,210,0.15)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    for(let i = -2; i < cols + 2; i++){
      for(let j = -2; j < rows + 2; j++){
        const x = startX + i * cellW;
        const y = startY + j * cellH;
        const jitterX = ((i * 13 + j * 7) % 10 - 5) * 0.6;
        const jitterY = ((i * 5 + j * 11) % 10 - 5) * 0.6;
        const px = x + jitterX;
        const py = y + jitterY;

        c.strokeStyle = 'rgba(212,175,90,0.7)';
        c.lineWidth = 3;
        c.beginPath();
        roundRect(c, px, py, cellW - 6, cellH - 6, 6);
        c.stroke();

        c.strokeStyle = 'rgba(212,175,90,0.35)';
        c.lineWidth = 1;
        c.beginPath();
        roundRect(c, px + 4, py + 4, cellW - 14, cellH - 14, 4);
        c.stroke();

        const grad = c.createRadialGradient(
          px + cellW/2, py + cellH/2, 4,
          px + cellW/2, py + cellH/2, cellW/2
        );
        grad.addColorStop(0, 'rgba(255,245,220,0.15)');
        grad.addColorStop(1, 'rgba(255,230,180,0.04)');
        c.fillStyle = grad;
        c.beginPath();
        roundRect(c, px + 5, py + 5, cellW - 16, cellH - 16, 4);
        c.fill();

        c.fillStyle = 'rgba(200,230,255,0.1)';
        c.beginPath();
        c.ellipse(px + cellW/2, py + cellH/2, cellW/2 - 30, cellH/2 - 22, 0, 0, Math.PI * 2);
        c.fill();

        const nx = px + cellW/2;
        const ny = py + cellH/2;
        const nr = 16;
        c.fillStyle = 'rgba(180,140,230,0.85)';
        c.beginPath();
        c.arc(nx, ny, nr, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = 'rgba(230,200,255,0.9)';
        c.beginPath();
        c.arc(nx - 3, ny - 3, 4, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = 'rgba(230,140,180,0.9)';
        c.beginPath();
        c.arc(nx + 5, ny + 5, 3, 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  function drawBlood(c){
    const w = canvas.width, h = canvas.height;
    c.fillStyle = 'rgba(255,240,235,0.1)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    // Детерминированное распределение, чтобы не мерцало
    const seed = (i) => ((Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1 + 1) % 1;

    for(let i = 0; i < 260; i++){
      const x = seed(i) * w * 3 - w;
      const y = seed(i + 1000) * h * 3 - h;
      const r = 11 + seed(i + 2000) * 3;
      c.fillStyle = 'rgba(180,30,50,0.15)';
      c.beginPath();
      c.arc(x + 2, y + 2, r + 1, 0, Math.PI * 2);
      c.fill();
      const grad = c.createRadialGradient(x, y, 1, x, y, r);
      grad.addColorStop(0, 'rgba(220,80,100,0.55)');
      grad.addColorStop(0.7, 'rgba(200,50,80,0.85)');
      grad.addColorStop(1, 'rgba(150,20,50,0.9)');
      c.fillStyle = grad;
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(255,200,210,0.35)';
      c.beginPath();
      c.arc(x, y, r * 0.55, 0, Math.PI * 2);
      c.fill();
    }

    for(let i = 0; i < 3; i++){
      const x = (0.2 + seed(i + 3000) * 0.6) * w;
      const y = (0.2 + seed(i + 4000) * 0.6) * h;
      const r = 24;
      c.fillStyle = 'rgba(200,220,255,0.15)';
      c.beginPath();
      c.arc(x, y, r + 6, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(220,230,255,0.7)';
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(120,80,180,0.85)';
      c.beginPath();
      for(let a = 0; a < Math.PI * 2; a += Math.PI / 8){
        const rr = 10 + Math.sin(a * 3 + i) * 4;
        const px = x + Math.cos(a) * rr;
        const py = y + Math.sin(a) * rr;
        if(a === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
    }

    for(let i = 0; i < 40; i++){
      const x = seed(i + 5000) * w * 3 - w;
      const y = seed(i + 6000) * h * 3 - h;
      c.fillStyle = 'rgba(230,200,150,0.6)';
      c.beginPath();
      c.ellipse(x, y, 4, 2.5, seed(i + 7000) * Math.PI, 0, Math.PI * 2);
      c.fill();
    }
  }

  /* ---------- ЛИСТ ЭЛОДЕИ: СТЕНКИ (СТАТИЧНО) ---------- */
  function drawLeafWalls(c){
    const w = canvas.width, h = canvas.height;

    c.fillStyle = 'rgba(230,245,220,0.12)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    const cellW = 130, cellH = 90;
    const cols = Math.ceil(w / cellW) + 4;
    const rows = Math.ceil(h / cellH) + 4;
    const startX = -cellW * 2;
    const startY = -cellH * 2;

    for(let i = 0; i < cols; i++){
      for(let j = 0; j < rows; j++){
        const x = startX + i * cellW;
        const y = startY + j * cellH;

        c.strokeStyle = 'rgba(120,180,100,0.55)';
        c.lineWidth = 2.5;
        c.beginPath();
        roundRect(c, x + 4, y + 4, cellW - 8, cellH - 8, 12);
        c.stroke();

        c.strokeStyle = 'rgba(120,180,100,0.2)';
        c.lineWidth = 1;
        c.beginPath();
        roundRect(c, x + 9, y + 9, cellW - 18, cellH - 18, 8);
        c.stroke();

        c.fillStyle = 'rgba(180,140,220,0.65)';
        c.beginPath();
        c.arc(x + 24, y + cellH / 2, 8, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = 'rgba(220,180,255,0.85)';
        c.beginPath();
        c.arc(x + 24, y + cellH / 2, 3, 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  /* ---------- ЛИСТ ЭЛОДЕИ: ХЛОРОПЛАСТЫ (ЖИВЫЕ) ---------- */
  function drawLeafChloroplasts(c, time){
    const list = leafState.chloroplasts;
    for(let i = 0; i < list.length; i++){
      const ch = list[i];
      const wobble = Math.sin(time * ch.wobbleSpeed + ch.wobble) * 1.4;
      const x = ch.cx + Math.cos(ch.angle) * ch.rx + ch.jitterX;
      const y = ch.cy + Math.sin(ch.angle) * ch.ry + ch.jitterY + wobble;

      c.save();
      c.translate(x, y);
      c.rotate(ch.rot + ch.angle * 0.35);

      c.fillStyle = 'rgba(20,60,30,0.22)';
      c.beginPath();
      c.ellipse(1.2, 1.2, ch.sizeX, ch.sizeY, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(55,150,75,0.94)';
      c.beginPath();
      c.ellipse(0, 0, ch.sizeX, ch.sizeY, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(170,235,140,0.7)';
      c.beginPath();
      c.ellipse(-ch.sizeX * 0.32, -ch.sizeY * 0.32, ch.sizeX * 0.5, ch.sizeY * 0.42, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(235,255,210,0.65)';
      c.beginPath();
      c.arc(-ch.sizeX * 0.35, -ch.sizeY * 0.35, 1.2, 0, Math.PI * 2);
      c.fill();

      c.restore();
    }
  }

  function drawInfusoria(c){
    const w = canvas.width, h = canvas.height;
    c.fillStyle = 'rgba(220,240,230,0.1)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    const seed = (i) => ((Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1 + 1) % 1;

    for(let n = 0; n < 4; n++){
      const x = w * (0.2 + seed(n + 100) * 0.6);
      const y = h * (0.2 + seed(n + 200) * 0.6);
      const angle = seed(n + 300) * Math.PI * 2;
      const scale = 0.9 + seed(n + 400) * 0.5;

      c.save();
      c.translate(x, y);
      c.rotate(angle);
      c.scale(scale, scale);

      const rx = 130, ry = 60;

      c.fillStyle = 'rgba(40,80,60,0.25)';
      c.beginPath();
      c.ellipse(3, 3, rx, ry, 0, 0, Math.PI * 2);
      c.fill();

      const grad = c.createRadialGradient(-20, -15, 5, 0, 0, rx);
      grad.addColorStop(0, 'rgba(220,250,230,0.9)');
      grad.addColorStop(0.5, 'rgba(160,220,180,0.85)');
      grad.addColorStop(1, 'rgba(80,150,110,0.85)');
      c.fillStyle = grad;
      c.beginPath();
      c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = 'rgba(60,120,90,0.7)';
      c.lineWidth = 2;
      c.stroke();

      c.strokeStyle = 'rgba(90,140,110,0.7)';
      c.lineWidth = 1.2;
      for(let a = 0; a < Math.PI * 2; a += 0.09){
        const cxs = Math.cos(a) * rx;
        const cys = Math.sin(a) * ry;
        const len = 12;
        const nx = Math.cos(a);
        const ny = Math.sin(a);
        c.beginPath();
        c.moveTo(cxs, cys);
        c.lineTo(cxs + nx * len, cys + ny * len);
        c.stroke();
      }

      [0, 1].forEach(i => {
        const vx = -40 + i * 80;
        const vy = -20 + i * 30;
        c.fillStyle = 'rgba(140,200,255,0.55)';
        c.beginPath();
        c.arc(vx, vy, 12, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = 'rgba(80,140,200,0.8)';
        c.lineWidth = 1.5;
        c.stroke();
      });

      c.fillStyle = 'rgba(180,120,220,0.7)';
      c.beginPath();
      c.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(220,180,255,0.8)';
      c.beginPath();
      c.arc(-4, -3, 6, 0, Math.PI * 2);
      c.fill();

      for(let i = 0; i < 5; i++){
        const a = i * 1.3;
        const vx = Math.cos(a) * 60;
        const vy = Math.sin(a) * 30;
        c.fillStyle = 'rgba(160,120,80,0.5)';
        c.beginPath();
        c.arc(vx, vy, 7, 0, Math.PI * 2);
        c.fill();
      }

      c.restore();
    }
  }

  function drawBacteria(c){
    const w = canvas.width, h = canvas.height;
    c.fillStyle = 'rgba(230,240,220,0.1)';
    c.fillRect(-w * 6, -h * 6, w * 13, h * 13);

    const seed = (i) => ((Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1 + 1) % 1;

    for(let i = 0; i < 80; i++){
      const x = seed(i) * w * 3 - w;
      const y = seed(i + 1000) * h * 3 - h;
      const angle = seed(i + 2000) * Math.PI * 2;
      const len = 50 + seed(i + 3000) * 30;
      const wid = 14 + seed(i + 4000) * 4;

      c.save();
      c.translate(x, y);
      c.rotate(angle);

      c.fillStyle = 'rgba(60,80,50,0.2)';
      c.beginPath();
      c.ellipse(2, 2, len/2 + 4, wid/2 + 2, 0, 0, Math.PI * 2);
      c.fill();

      const grad = c.createLinearGradient(-len/2, 0, len/2, 0);
      grad.addColorStop(0, 'rgba(200,230,190,0.85)');
      grad.addColorStop(0.5, 'rgba(230,245,220,0.9)');
      grad.addColorStop(1, 'rgba(180,210,170,0.85)');
      c.fillStyle = grad;
      c.beginPath();
      c.ellipse(0, 0, len / 2, wid / 2, 0, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = 'rgba(90,140,80,0.7)';
      c.lineWidth = 1.6;
      c.stroke();

      if(seed(i + 5000) > 0.4){
        c.strokeStyle = 'rgba(120,160,100,0.5)';
        c.lineWidth = 1.5;
        c.beginPath();
        c.moveTo(len/2, 0);
        for(let t = 0; t < 40; t += 4){
          c.lineTo(len/2 + t, Math.sin(t * 0.4 + i) * 6);
        }
        c.stroke();
      }

      for(let k = 0; k < 3; k++){
        c.fillStyle = 'rgba(140,180,120,0.5)';
        c.beginPath();
        c.arc(-len/4 + k * len/4, seed(i + 6000 + k) * 4 - 2, 2.5, 0, Math.PI * 2);
        c.fill();
      }

      c.restore();
    }

    for(let i = 0; i < 6; i++){
      const x = seed(i + 7000) * w * 3 - w;
      const y = seed(i + 8000) * h * 3 - h;
      c.fillStyle = 'rgba(255,255,240,0.7)';
      c.beginPath();
      c.arc(x, y, 10, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = 'rgba(180,180,140,0.7)';
      c.lineWidth = 1.5;
      c.stroke();
    }
  }

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  /* ============================================================
     АНИМАЦИЯ ЦИКЛОЗА (ЛИСТ ЭЛОДЕИ)
     ============================================================ */
  const leafState = {
    initialized: false,
    chloroplasts: [],
    elapsed: 0
  };

  function initLeafState(){
    if(leafState.initialized) return;

    const w = canvas.width, h = canvas.height;
    const cellW = 130, cellH = 90;
    const cols = Math.ceil(w / cellW) + 4;
    const rows = Math.ceil(h / cellH) + 4;
    const startX = -cellW * 2;
    const startY = -cellH * 2;

    leafState.chloroplasts = [];

    for(let i = 0; i < cols; i++){
      for(let j = 0; j < rows; j++){
        const cx = startX + i * cellW + cellW / 2;
        const cy = startY + j * cellH + cellH / 2;
        const count = 9 + Math.floor(Math.random() * 4);
        const dir = ((i + j) % 2 === 0) ? 1 : -1;

        for(let k = 0; k < count; k++){
          const rx = cellW / 2 - 24 - Math.random() * 8;
          const ry = cellH / 2 - 18 - Math.random() * 6;

          leafState.chloroplasts.push({
            cx, cy, rx, ry,
            angle: Math.random() * Math.PI * 2,
            speed: (0.25 + Math.random() * 0.15) * dir,
            sizeX: 8 + Math.random() * 3,
            sizeY: 4.5 + Math.random() * 1.5,
            rot: Math.random() * Math.PI,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.6 + Math.random() * 0.9,
            jitterX: (Math.random() - 0.5) * 3,
            jitterY: (Math.random() - 0.5) * 3
          });
        }
      }
    }

    leafState.initialized = true;
  }

  function updateLeafAnimation(dt){
    const list = leafState.chloroplasts;
    for(let i = 0; i < list.length; i++){
      list[i].angle += list[i].speed * dt;
    }
  }

  let leafAnimFrame = null;
  let leafLastTime = 0;

  function leafAnimLoop(now){
    if(state.specimen !== 'leaf'){
      leafAnimFrame = null;
      return;
    }

    const dt = Math.min(0.05, (now - leafLastTime) / 1000 || 0.016);
    leafLastTime = now;
    leafState.elapsed += dt;

    updateLeafAnimation(dt);
    render();

    leafAnimFrame = requestAnimationFrame(leafAnimLoop);
  }

  function ensureLeafAnim(){
    if(state.specimen === 'leaf' && !leafAnimFrame){
      leafLastTime = performance.now();
      leafAnimFrame = requestAnimationFrame(leafAnimLoop);
    }
  }

  /* ---------- РАЗМЕР ---------- */
  function resize(){
    const dpr = Math.min(window.devicePixelRatio, 2);
    const rect = eyepiece.getBoundingClientRect();
    if(rect.width === 0) return;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    // Пересоздать хлоропласты под новый размер
    leafState.initialized = false;
    if(state.specimen === 'leaf') initLeafState();

    render();
  }
  window.addEventListener('resize', resize);

  /* ---------- ПАРАМЕТРЫ ---------- */
  let state = {
    specimen: 'onion',
    zoom: 400,
    focus: 100,
    light: 90,
    offsetX: 0,
    offsetY: 0,
    drag: null
  };

  const zoomRange = document.getElementById('zoomRange');
  const focusRange = document.getElementById('focusRange');
  const lightRange = document.getElementById('lightRange');
  const zoomVal = document.getElementById('zoomVal');
  const focusVal = document.getElementById('focusVal');
  const lightVal = document.getElementById('lightVal');
  const zoomFill = document.getElementById('zoomFill');
  const focusFill = document.getElementById('focusFill');
  const lightFill = document.getElementById('lightFill');
  const magScale = document.getElementById('magScale');

  function updateKnob(range, fill){
    const min = +range.min, max = +range.max, v = +range.value;
    fill.style.width = ((v - min) / (max - min) * 100) + '%';
  }

  /* ---------- РЕНДЕР ---------- */
  function render(){
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if(w === 0 || h === 0) return;

    ctx.clearRect(0, 0, w, h);

    const bg = ctx.createRadialGradient(w/2, h/2, 20, w/2, h/2, Math.max(w, h) * 0.7);
    bg.addColorStop(0, 'rgba(255,255,240,' + (0.15 * state.light / 100) + ')');
    bg.addColorStop(1, 'rgba(80,100,80,' + (0.1 * state.light / 100) + ')');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const spec = SPECIMENS[state.specimen];
    if(spec && spec.draw){
      if(state.specimen === 'leaf'){
        initLeafState();
      }

      const zoomScale = state.zoom / 400;
      const offX = state.offsetX;
      const offY = state.offsetY;

      ctx.save();
      ctx.translate(w/2 + offX * 0.4, h/2 + offY * 0.4);
      ctx.scale(zoomScale * 0.9, zoomScale * 0.9);
      ctx.translate(-w/2, -h/2);
      ctx.globalAlpha = 0.35;
      spec.draw(ctx);
      ctx.restore();

      ctx.save();
      ctx.translate(w/2 + offX, h/2 + offY);
      ctx.scale(zoomScale, zoomScale);
      ctx.translate(-w/2, -h/2);

      spec.draw(ctx);

      if(spec.drawDynamic){
        spec.drawDynamic(ctx, leafState.elapsed);
      }
      ctx.restore();

      if(state.specimen === 'infusoria' || state.specimen === 'bacteria'){
        ctx.save();
        ctx.translate(w/2 + offX * 1.5, h/2 + offY * 1.5);
        ctx.scale(zoomScale * 1.2, zoomScale * 1.2);
        ctx.translate(-w/2, -h/2);
        ctx.globalAlpha = 0.25;
        spec.draw(ctx);
        ctx.restore();
      }
    }

    const vig = ctx.createRadialGradient(w/2, h/2, w*0.35, w/2, h/2, w*0.55);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);

    const blur = (100 - state.focus) * 0.06;
    const bright = state.light / 100;
    const contrast = 1 + (state.light - 90) * 0.002;
    canvas.style.filter = `blur(${blur}px) brightness(${bright}) contrast(${contrast}) saturate(${1.05})`;

    if(state.specimen === 'leaf'){
      ensureLeafAnim();
    }
  }

  /* ---------- ОБРАБОТЧИКИ ---------- */

  zoomRange.addEventListener('input', () => {
    state.zoom = +zoomRange.value;
    zoomVal.textContent = '×' + state.zoom;
    magScale.textContent = '×' + state.zoom;
    updateKnob(zoomRange, zoomFill);
    render();
  });

  focusRange.addEventListener('input', () => {
    state.focus = +focusRange.value;
    focusVal.textContent = state.focus + '%';
    updateKnob(focusRange, focusFill);
    render();
  });

  lightRange.addEventListener('input', () => {
    state.light = +lightRange.value;
    lightVal.textContent = state.light + '%';
    updateKnob(lightRange, lightFill);
    render();
  });

  eyepiece.addEventListener('pointerdown', (e) => {
    if(e.target.closest('input')) return;
    state.drag = {
      startX: e.clientX,
      startY: e.clientY,
      baseX: state.offsetX,
      baseY: state.offsetY
    };
    eyepiece.setPointerCapture(e.pointerId);
  });

  eyepiece.addEventListener('pointermove', (e) => {
    if(!state.drag) return;
    state.offsetX = state.drag.baseX + (e.clientX - state.drag.startX);
    state.offsetY = state.drag.baseY + (e.clientY - state.drag.startY);
    render();
  });

  eyepiece.addEventListener('pointerup', () => {
    state.drag = null;
  });
  eyepiece.addEventListener('pointercancel', () => state.drag = null);

  eyepiece.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.5;
    state.zoom = Math.max(40, Math.min(400, state.zoom + delta));
    zoomRange.value = state.zoom;
    zoomVal.textContent = '×' + Math.round(state.zoom);
    magScale.textContent = '×' + Math.round(state.zoom);
    updateKnob(zoomRange, zoomFill);
    render();
  }, {passive:false});

  document.querySelectorAll('.slide').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.slide').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.specimen = btn.dataset.specimen;
      state.offsetX = 0;
      state.offsetY = 0;

      // Сброс/запуск анимации листа
      if(state.specimen === 'leaf'){
        leafState.initialized = false;
        leafState.elapsed = 0;
      } else {
        if(leafAnimFrame){
          cancelAnimationFrame(leafAnimFrame);
          leafAnimFrame = null;
        }
      }

      canvas.style.transition = 'filter .4s, opacity .3s';
      canvas.style.opacity = '0.2';
      setTimeout(() => {
        render();
        canvas.style.opacity = '1';
      }, 200);

      const liveBadge = document.getElementById('liveBadge');
      if(liveBadge){
        liveBadge.style.display = (state.specimen === 'leaf') ? 'inline-flex' : 'none';
      }

      updateSpecimenInfo(state.specimen);
    });
  });

  /* ---------- ИНФО О ПРЕПАРАТЕ ---------- */
  function updateSpecimenInfo(key){
    const s = SPECIMENS[key];
    if(!s) return;
    document.getElementById('specimenRank').textContent = s.rank;
    document.getElementById('specimenName').textContent = s.name;
    document.getElementById('specimenLatin').textContent = s.latin;
    document.getElementById('specimenDesc').textContent = s.desc;
    document.getElementById('specimenFacts').innerHTML = s.facts
      .map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`)
      .join('');
    document.getElementById('observations').innerHTML = s.observations;
  }

  /* ---------- СТАРТ ---------- */
  updateKnob(zoomRange, zoomFill);
  updateKnob(focusRange, focusFill);
  updateKnob(lightRange, lightFill);
  updateSpecimenInfo('onion');

  setTimeout(resize, 50);
  setTimeout(resize, 300);

  setTimeout(() => {
    state.focus = 30;
    focusRange.value = 30;
    updateKnob(focusRange, focusFill);
    focusVal.textContent = '30%';
    render();

    let f = 30;
    const int = setInterval(() => {
      f += 4;
      if(f >= 100){
        f = 100;
        clearInterval(int);
      }
      state.focus = f;
      focusRange.value = f;
      focusVal.textContent = f + '%';
      updateKnob(focusRange, focusFill);
      render();
    }, 30);
  }, 500);

})();
</script>
</body>
</html>
